name: PAT-000 — Smoke Test

on:
  push:
    branches: ['**']        # Every push to every branch
  pull_request:
    branches: ['**']
  workflow_dispatch:        # Manual trigger from GitHub UI

concurrency:
  group: pat-000-${{ github.ref }}
  cancel-in-progress: true  # Cancel stale runs on force-push

jobs:
  smoke:
    name: PAT-000 Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── Setup ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      # ── Verify Prisma Client ───────────────────────────────
      - name: Verify Prisma Client
        run: |
          npx prisma generate
          node -e "require('@prisma/client')"

      # ── Run PAT-000 ────────────────────────────────────────
      - name: Run PAT-000 Smoke Test
        run: npm run e2e:pat000
        env:
          CI: true
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_JOIN_URL: ${{ secrets.E2E_JOIN_URL }}
          E2E_DASHBOARD_URL: ${{ secrets.E2E_DASHBOARD_URL }}
          E2E_EMAIL_DOMAIN: ${{ secrets.E2E_EMAIL_DOMAIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      # ── Upload artifacts (always — even on success for PAT-000) ──
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pat-000-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Playwright traces (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pat-000-traces-${{ github.run_number }}
          path: test-results/**/*.zip
          retention-days: 14

      - name: Upload screenshots (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pat-000-screenshots-${{ github.run_number }}
          path: test-results/**/*.png
          retention-days: 14
